<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <g fill="#4A3728" opacity="0.12">

    <!-- Dog head silhouette -->
    <g transform="translate(30,40) rotate(-12) scale(0.9)">
      <path d="M20 10 C5 10 0 25 5 35 C-5 40 -5 55 5 60 C0 70 10 85 30 85 C50 85 65 75 65 55 C75 50 75 30 60 25 C60 10 45 5 35 10 C30 5 25 5 20 10 Z"/>
      <ellipse cx="15" cy="30" rx="6" ry="10" transform="rotate(-20 15 30)"/>
      <ellipse cx="50" cy="25" rx="6" ry="10" transform="rotate(20 50 25)"/>
    </g>

    <!-- Bone -->
    <g transform="translate(180,20) rotate(25) scale(0.7)">
      <path d="M10 25 a10 10 0 1 1 15 -10 a10 10 0 1 1 15 10 l20 20 a10 10 0 1 1 10 15 a10 10 0 1 1 -10 15 l-20 20 a10 10 0 1 1 -15 10 a10 10 0 1 1 -15 -10 Z"/>
    </g>

    <!-- Cat head silhouette -->
    <g transform="translate(300,60) rotate(8) scale(0.85)">
      <path d="M15 30 L0 0 L30 15 C40 5 55 5 65 15 L95 0 L80 30 C90 45 90 65 75 78 C60 90 35 90 20 78 C5 65 5 45 15 30 Z"/>
      <circle cx="35" cy="45" r="2.5"/>
      <circle cx="60" cy="45" r="2.5"/>
    </g>

    <!-- Paw print -->
    <g transform="translate(60,160) rotate(-10) scale(0.8)">
      <ellipse cx="20" cy="35" rx="14" ry="18"/>
      <circle cx="4" cy="10" r="6"/>
      <circle cx="18" cy="2" r="6.5"/>
      <circle cx="34" cy="4" r="6"/>
      <circle cx="42" cy="16" r="5.5"/>
    </g>

    <!-- Fish treat -->
    <g transform="translate(220,150) rotate(-30) scale(0.75)">
      <path d="M5 20 C20 0 60 0 75 20 C60 40 20 40 5 20 Z M75 20 L95 5 L90 20 L95 35 Z"/>
      <circle cx="20" cy="17" r="2"/>
    </g>

    <!-- Small dog head (mirrored, different size) -->
    <g transform="translate(340,230) rotate(15) scale(0.55)">
      <path d="M20 10 C5 10 0 25 5 35 C-5 40 -5 55 5 60 C0 70 10 85 30 85 C50 85 65 75 65 55 C75 50 75 30 60 25 C60 10 45 5 35 10 C30 5 25 5 20 10 Z"/>
      <ellipse cx="15" cy="30" rx="6" ry="10" transform="rotate(-20 15 30)"/>
      <ellipse cx="50" cy="25" rx="6" ry="10" transform="rotate(20 50 25)"/>
    </g>

    <!-- Paw print, scattered -->
    <g transform="translate(150,280) rotate(35) scale(0.6)">
      <ellipse cx="20" cy="35" rx="14" ry="18"/>
      <circle cx="4" cy="10" r="6"/>
      <circle cx="18" cy="2" r="6.5"/>
      <circle cx="34" cy="4" r="6"/>
      <circle cx="42" cy="16" r="5.5"/>
    </g>

    <!-- Bone, scattered small -->
    <g transform="translate(30,320) rotate(-45) scale(0.5)">
      <path d="M10 25 a10 10 0 1 1 15 -10 a10 10 0 1 1 15 10 l20 20 a10 10 0 1 1 10 15 a10 10 0 1 1 -10 15 l-20 20 a10 10 0 1 1 -15 10 a10 10 0 1 1 -15 -10 Z"/>
    </g>

    <!-- Cat head, small scattered -->
    <g transform="translate(260,330) rotate(-15) scale(0.6)">
      <path d="M15 30 L0 0 L30 15 C40 5 55 5 65 15 L95 0 L80 30 C90 45 90 65 75 78 C60 90 35 90 20 78 C5 65 5 45 15 30 Z"/>
      <circle cx="35" cy="45" r="2.5"/>
      <circle cx="60" cy="45" r="2.5"/>
    </g>

    <!-- Extra paw prints for scatter density -->
    <g transform="translate(370,120) rotate(60) scale(0.4)">
      <ellipse cx="20" cy="35" rx="14" ry="18"/>
      <circle cx="4" cy="10" r="6"/>
      <circle cx="18" cy="2" r="6.5"/>
      <circle cx="34" cy="4" r="6"/>
      <circle cx="42" cy="16" r="5.5"/>
    </g>

    <g transform="translate(100,380) rotate(-20) scale(0.45)">
      <ellipse cx="20" cy="35" rx="14" ry="18"/>
      <circle cx="4" cy="10" r="6"/>
      <circle cx="18" cy="2" r="6.5"/>
      <circle cx="34" cy="4" r="6"/>
      <circle cx="42" cy="16" r="5.5"/>
    </g>

  </g>
</svg>
